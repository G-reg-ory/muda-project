<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muda tracking log</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Body Weld 1 Muda log</h1>

    <!-- First Dropdown -->
    <label for="dropdown1">Select Category:</label>
    <select id="dropdown1" onchange="updateDropdown2()">
        <option value="">--Choose--</option>
        <option value="leftFrontDoor">Left Front Door</option>
        <option value="leftRearDoor">Left Rear Door</option>
        <option value="hood">Hood</option>
        <option value="rightFrontDoor">Right Front Door</option>
        <option value="rightRearDoor">Right Rear Door</option>
        <option value="luggage">Luggage</option>
    </select>

    <!-- Second Dropdown -->
    <label for="dropdown2">Select Item:</label>
    <select id="dropdown2">
        <option value="">--Choose--</option>
    </select>

    <!-- Radio Buttons -->
    <fieldset>
        <legend>Reason for Issue:</legend>
        <label>
            <input type="radio" name="issue" value="shop">
            Damaged in Shop
        </label>
        <label>
            <input type="radio" name="issue" value="received">
            Received Damaged
        </label>
    </fieldset>
    <script src="script.js"></script>
</body>
</html>
